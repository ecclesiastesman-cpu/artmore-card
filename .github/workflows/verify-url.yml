name: verify-url
on:
  push:
    branches: ['claude/diablo-rpg-iphone-game-x8frpk']
    paths: ['game/deploy/verify.json']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Check deployed game responds
        run: |
          set -e
          URL=$(python3 -c "import json;print(json.load(open('game/deploy/verify.json'))['url'])")
          {
            echo "url: $URL"
            echo "status: $(curl -s -o /tmp/page.html -w '%{http_code}' -L "$URL")"
            echo "sw: $(curl -s -o /dev/null -w '%{http_code}' -L "${URL}sw.js")"
            echo "asset: $(curl -s -o /dev/null -w '%{http_code}' -L "${URL}assets/hero_barbarian.webp")"
            echo "title_found: $(grep -c 'Последняя Свеча' /tmp/page.html || true)"
          } > game/deploy/verify-result.txt
          cat game/deploy/verify-result.txt
      - name: Commit result
        run: |
          git config user.name "verifier"
          git config user.email "actions@github.com"
          git add game/deploy/verify-result.txt
          git commit -m "Проверка опубликованного URL" || true
          git push
